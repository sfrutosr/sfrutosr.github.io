<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sergio Frutos</title>
  <meta name="description" content="Graduado en Derecho | Logístico de profesión | Padre de familia">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      background-color: #262729;
      background-image:
        radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.28) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 42% 14%, rgba(255,255,255,0.22) 50%, transparent 100%),
        radial-gradient(1px 1px at 78% 25%, rgba(255,255,255,0.3) 50%, transparent 100%),
        radial-gradient(1px 1px at 28% 55%, rgba(255,255,255,0.2) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 64% 62%, rgba(255,255,255,0.25) 50%, transparent 100%),
        radial-gradient(1px 1px at 88% 72%, rgba(255,255,255,0.28) 50%, transparent 100%),
        radial-gradient(1px 1px at 12% 84%, rgba(255,255,255,0.22) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 51% 89%, rgba(255,255,255,0.2) 50%, transparent 100%);
      background-size: 260px 260px;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 48px;
    }

    .intro h1 {
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.1;
      margin-bottom: 14px;
    }

    .intro p {
      font-size: 1.05rem;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.88);
      max-width: 440px;
    }

    .avatar {
      width: 136px;
      height: 136px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      background-color: #3a3c40;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .tile {
      aspect-ratio: 1 / 1;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
    }

    .tile:hover {
      transform: translateY(-4px) scale(1.02);
      filter: brightness(1.06);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
    }

    .tile svg {
      width: 44%;
      height: 44%;
      fill: #ffffff;
    }

    .tile-x { background-color: #2c2d30; }
    .tile-mastodon { background-color: #5492f5; }
    .tile-instagram { background-color: #e36cb6; }
    .tile-linkedin { background-color: #414ec6; }
    .tile-strava { background-color: #ea913b; }
    .tile-pixelfed { background-color: #d2575d; }

    @media (max-width: 560px) {
      header {
        flex-direction: column-reverse;
        text-align: center;
        margin-bottom: 36px;
      }
      .avatar {
        width: 112px;
        height: 112px;
      }
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }
      .tile {
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>

      </div>
      <!-- Sube tu foto como avatar.jpg al repositorio o usa una URL directa -->
      <img class="avatar" src="avatar.jpg" alt="Sergio Frutos">
